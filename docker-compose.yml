services:
  web:
    image: nginx:alpine
    container_name: sanbong-web
    depends_on:
      - api
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./scrollcraft.css:/usr/share/nginx/html/scrollcraft.css:ro
      - ./scrollcraft.js:/usr/share/nginx/html/scrollcraft.js:ro
      - ./logo-icon.svg:/usr/share/nginx/html/logo-icon.svg:ro
      - ./logo.svg:/usr/share/nginx/html/logo.svg:ro
      - ./og-image.jpg:/usr/share/nginx/html/og-image.jpg:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sanbong.rule=Host(`sanbong.cloud`)
      - traefik.http.routers.sanbong.entrypoints=websecure
      - traefik.http.routers.sanbong.tls.certresolver=letsencrypt
      - traefik.http.routers.sanbong.tls=true
      - traefik.http.routers.sanbong.tls.domains[0].main=sanbong.cloud
      - traefik.http.routers.sanbong.service=sanbong
      - traefik.http.services.sanbong.loadbalancer.server.port=80
      - traefik.http.routers.sanbong-http.rule=Host(`sanbong.cloud`)
      - traefik.http.routers.sanbong-http.entrypoints=web
      - traefik.http.routers.sanbong-http.middlewares=sanbong-redirect-https
      - traefik.http.routers.sanbong-http.service=sanbong
      - traefik.http.middlewares.sanbong-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.sanbong-redirect-https.redirectscheme.permanent=true
    restart: unless-stopped

  api:
    build: ./api
    container_name: sanbong-api
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - internal
    restart: unless-stopped

networks:
  proxy:
    external: true
  internal:
    driver: bridge
